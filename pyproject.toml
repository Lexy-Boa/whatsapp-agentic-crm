[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-agentic-crm"
version = "0.1.0"
description = "Agentic WhatsApp commerce CRM: Claude tool-use pipeline with dialect-aware voice transcription"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.10.0",
    "pydantic-settings~=2.7.0",
    "sqlalchemy[asyncio]~=2.0.36",
    "asyncpg~=0.30.0",
    "alembic~=1.14.0",
    "redis[hiredis]~=5.2.0",
    "httpx~=0.28.0",
    "anthropic~=0.40.0",
    "openai~=1.59.0",
    "groq>=0.4.0",
    "python-multipart~=0.0.20",
    "structlog~=24.4.0",
    "qdrant-client~=1.9.0",
    "tenacity~=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-httpx~=0.35.0",
    "httpx~=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: tests that require a running PostgreSQL instance"]

[tool.ruff]
line-length = 100
target-version = "py312"
